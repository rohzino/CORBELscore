# Build CORBELscore.exe and publish it as a GitHub Release when a version tag
# (v2.0.0-alpha.4, v2.1.0 …) is pushed. Tests run first; nothing is published
# if they fail.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test
        run: node --test
      - name: Download the Electron runtime
        run: |
          EV=$(grep -oP 'set "EV=\K[0-9.]+' CORBELscore.bat)
          curl -fsSL -o electron.zip "https://github.com/electron/electron/releases/download/v$EV/electron-v$EV-win32-x64.zip"
      - name: Build CORBELscore.exe
        run: python3 scripts/exe/build.py --electron electron.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SUM=$(sha256sum dist/CORBELscore.exe | cut -d' ' -f1)
          { cat scripts/exe/release-notes.md; echo; echo "SHA-256 of \`CORBELscore.exe\`: \`$SUM\`"; } > notes.md
          PRE=""; case "$TAG" in *-*) PRE="--prerelease";; esac
          gh release create "$TAG" dist/CORBELscore.exe --title "CORBELscore ${TAG#v}" --notes-file notes.md $PRE
