[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telescore"
dynamic = ["version"]
description = "Open-source scoreboard and live scoring for streams and broadcast"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.5"]

[project.optional-dependencies]
hotkeys = ["pynput>=1.7"]
dev = ["lxml", "playwright"]

[project.scripts]
telescore = "telescore.__main__:run"

[tool.setuptools.dynamic]
version = { attr = "telescore.__version__" }

[tool.setuptools.packages.find]
include = ["telescore*"]

[tool.setuptools.package-data]
telescore = ["assets/*", "assets/fonts/*", "outputs/overlay.js"]

[tool.ruff]
line-length = 120
